# .github/workflows/snake.yml
#
# One-time setup:
#   1. Put this file at .github/workflows/snake.yml in your
#      sailikita123/sailikita123 repo.
#   2. Go to the repo's Settings -> Actions -> General -> Workflow permissions,
#      and set it to "Read and write permissions". Save.
#   3. Go to the Actions tab and manually run "generate-snake" once
#      (or just wait for the daily schedule / next push to main).
#   4. It creates an "output" branch containing the generated SVG,
#      which is exactly what README.md's snake <img> tag points to.
#
name: generate-snake

on:
  schedule:
    - cron: "0 */12 * * *"   # regenerate twice a day
  push:
    branches:
      - main
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: sailikita123
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
